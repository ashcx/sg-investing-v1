name: Build frontend data packs

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Update market data"]
    types:
      - completed

permissions:
  contents: read

jobs:
  build-packs:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev,market-data]"
      - name: Refresh the canonical snapshot
        run: python scripts/update_data.py
      - name: Validate the snapshot
        run: python -m pytest -m "not smoke"
      - name: Build frontend data packs
        run: python scripts/build_data_packs.py
      - name: Verify pack manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads((Path("frontend/data/packs") / "manifest.json").read_text())
          assert manifest["schema_version"] == 1, "unexpected pack schema version"
          assert manifest["pack_count"] > 0, "no packs were built"
          assert manifest["summary"]["securities"] == len(manifest["securities"])
          print(
              "data packs:",
              manifest["summary"]["pack_count"],
              "packs,",
              manifest["summary"]["securities"],
              "securities, snapshot",
              manifest["data_snapshot_id"],
          )
          PY
      - name: Upload frontend data packs artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-data-packs
          path: frontend/data/packs
          if-no-files-found: error
