name: Update market data

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canonical-market-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -c config/update-constraints.txt ".[dev,market-data]"
      - name: Run manual full reconciliation with resource log
        run: /usr/bin/time -v python scripts/update_data.py > full-update-output.json 2> full-update-diagnostics.log
      - name: Refuse an incomplete full-refresh artifact
        run: |
          python - <<'PYCODE'
          import json
          from pathlib import Path
          summary = json.loads(Path("data/update_summary.json").read_text())
          assert not summary.get("failed"), "Price updates failed"
          assert not summary.get("warnings"), "Price observations are missing"
          assert not any(row.get("error") for row in summary.get("dividend_updates", [])), "Dividend queries failed"
          PYCODE
      - run: python -m pytest -m "not smoke"
      - uses: actions/upload-artifact@v4
        with:
          name: validated-data-update-summary
          path: data/update_summary.json
      - name: Retain manual reconciliation failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-update-diagnostics-${{ github.run_id }}
          retention-days: 7
          path: |
            full-update-output.json
            full-update-diagnostics.log
          if-no-files-found: warn
