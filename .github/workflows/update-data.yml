name: Update market data

on:
  workflow_dispatch:
  schedule:
    - cron: "30 12 * * 1-5"

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev,market-data]"
      - run: python scripts/update_data.py
      - run: python -m pytest -m "not smoke"
      - uses: actions/upload-artifact@v4
        with:
          name: validated-data-update-summary
          path: data/update_summary.json
