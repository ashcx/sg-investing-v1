name: Incremental data update

# Refreshes produce review artifacts, never automatic canonical commits or deploys.
on:
  workflow_dispatch:
    inputs:
      securities:
        description: "Comma-separated tickers for a canary; empty selects the catalog"
        required: false
        type: string
      build_packs:
        description: "Build complete packs from the resulting canonical snapshot"
        required: false
        default: false
        type: boolean
  schedule:
    # 06:00 Singapore Tue–Sat: buffered after US close in either DST season.
    - cron: "0 22 * * 1-5"

permissions:
  contents: read

concurrency:
  group: canonical-market-data-update
  cancel-in-progress: false

jobs:
  update-incremental:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -c config/update-constraints.txt ".[dev,market-data]"
      - name: Record exact runtime dependencies
        run: |
          mkdir -p update-diagnostics
          python -m pip freeze > update-diagnostics/dependencies.txt
      - name: Verify deterministic updater regressions
        run: python -m pytest tests/test_incremental_update.py tests/test_incremental_coverage.py tests/test_listing_removal.py tests/test_provider_guard.py tests/test_yahoo_provider.py -q
      - name: Refresh bounded reconciliation windows
        env:
          UPDATE_SECURITIES: ${{ inputs.securities }}
        run: |
          args=(--since auto --no-build-packs)
          if [ -n "$UPDATE_SECURITIES" ]; then args+=(--securities "$UPDATE_SECURITIES"); fi
          /usr/bin/time -v python scripts/update_incremental.py "${args[@]}" > update-incremental-output.json 2> update-incremental-diagnostics.log
      - name: Validate resulting canonical store
        run: python -m pytest -m "not smoke"
      - name: Build complete pack artifact when requested
        if: inputs.build_packs == true
        run: python scripts/build_data_packs.py > update-pack-build.json
      - name: Collect validated changed store files
        run: |
          python - <<'PY'
          import json, subprocess, tarfile
          from pathlib import Path
          summary = json.loads(Path("data/update_summary.json").read_text())
          assert summary["complete"], "Incomplete updates must not produce publication artifacts"
          files = subprocess.check_output(
              ["git", "ls-files", "-m", "-o", "--exclude-standard", "-z", "--", "data"],
          ).decode().split("\0")
          files = sorted(set(path for path in files if path and Path(path).is_file()))
          Path("changed-store-files.txt").write_text("\n".join(files) + "\n")
          with tarfile.open("incremental-store-changes.tgz", "w:gz") as archive:
              for path in files:
                  archive.add(path, arcname=path)
          PY
      - name: Upload validated update for operator review
        uses: actions/upload-artifact@v4
        with:
          name: incremental-update-${{ github.run_id }}
          retention-days: ${{ inputs.build_packs && 1 || 7 }}
          path: |
            incremental-store-changes.tgz
            changed-store-files.txt
            data/update_summary.json
            frontend/data/packs/
          if-no-files-found: error
      - name: Upload diagnostics even when the refresh fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: incremental-diagnostics-${{ github.run_id }}
          retention-days: 7
          path: |
            update-diagnostics/
            update-incremental-output.json
            update-incremental-diagnostics.log
            update-pack-build.json
          if-no-files-found: warn
